<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Guru - E-Worksheet</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-light login-body">

    <div class="login-container">
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Kembali ke Beranda</a>
        
        <div class="login-card shadow-lg">
            <div class="login-header text-center">
                <div class="icon-bg mx-auto"><i class="fas fa-chalkboard-teacher"></i></div>
                <h2>Portal Guru</h2>
                <p>Masuk untuk mengelola nilai kuis dan evaluasi video Think-Aloud siswa.</p>
            </div>
            
            <form action="dashboard-guru.html" method="GET" class="login-form">
                <div class="input-group">
                    <label for="username">NIP / Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Masukkan NIP atau Username" required />
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Masukkan Password" required />
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" /> Ingat Saya
                    </label>
                    <a href="#" class="forgot-password">Lupa Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg mt-4 shadow-hover">
                    <i class="fas fa-sign-in-alt"></i> Masuk ke Dashboard
                </button>
            </form>
        </div>
    </div>

</body>
</html>
